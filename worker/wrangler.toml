name = "task-dashboard"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "STORE"
class_name = "TaskStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskStore"]

# 승격 시 원본과 바이트 단위로 비교할 수 있게 두 모듈을 그대로 배포한다.
[env.dev]
name = "task-dashboard-dev"
workers_dev = true
no_bundle = true
find_additional_modules = true

[[env.dev.rules]]
type = "ESModule"
globs = ["html.js"]
fallthrough = true

[env.dev.observability]
enabled = true

# 개발 Worker 소유의 DO를 만든다. INGEST_KEY도 --env dev로 따로 설정한다.
[[env.dev.durable_objects.bindings]]
name = "STORE"
class_name = "TaskStore"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["TaskStore"]
