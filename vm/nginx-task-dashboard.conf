# 443 TLS blocks live in a separate Engineering-managed file /etc/nginx/sites-available/task-dashboard-https; this file only redirects 80->443.
server {
    listen 80;
    listen [::]:80;
    server_name task-dashboard-dev.velar-agent.duckdns.org;
    return 301 https://$host$request_uri;
}
